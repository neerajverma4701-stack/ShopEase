<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase | Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ShopEase</h1>

        <input
            type="text"
            id="search"
            placeholder="Search products..."
        >

        <button id="cartButton">
            Cart (<span id="cartCount">0</span>)
        </button>
    </header>

    <nav>
        <button class="filter" data-category="All">All</button>
        <button class="filter" data-category="Clothing">Clothing</button>
        <button class="filter" data-category="Shoes">Shoes</button>
        <button class="filter" data-category="Electronics">Electronics</button>
    </nav>

    <main>
        <h2>Featured Products</h2>
        <div id="products"class="product">
<h2>test product-RS 999</h2>
</div>

        <section id="cartSection">
            <h2>Your Shopping Cart</h2>
            <div id="cartItems"></div>
            <h3>Total: ?<span id="cartTotal">0</span></h3>
        </section>
    </main>

    <footer>
        <p>© 2026 ShopEase. Built with HTML, CSS & JavaScript.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
